<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        :root { --primary: #00b689; }
        .card { text-align: center; background: white; padding: 60px 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); max-width: 450px; }
        .card i { font-size: 4rem; color: var(--primary); margin-bottom: 20px; }
        .card h1 { font-size: 3rem; color: #2d3436; margin-bottom: 5px; }
        .card h2 { font-size: 1.3rem; color: #636e72; margin-bottom: 15px; font-weight: 400; }
        .card p { color: #636e72; margin-bottom: 25px; }
        .card a { display: inline-block; background: var(--primary); color: white; padding: 12px 30px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .card a:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,182,137,0.3); }
        .links { margin-top: 20px; display: flex; gap: 15px; justify-content: center; }
        .links a { background: transparent; color: var(--primary); padding: 8px 20px; border: 1px solid var(--primary); font-size: 0.9rem; }
        .links a:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-map-signs"></i>
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>La página que buscas no existe o fue movida.</p>
        <a href="/"><i class="fas fa-home"></i> Volver al Inicio</a>
        <div class="links">
            <a href="/portal"><i class="fas fa-user-friends"></i> Portal</a>
            <a href="/contacto"><i class="fas fa-envelope"></i> Contacto</a>
        </div>
    </div>
</body>
</html>
