<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00b689">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        :root {
            --primary: #00b689;
            --bg-color: #f8fafb;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 25px;
            color: var(--text-dark);
        }

        .module-header {
            margin-bottom: 25px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }

        .card-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            padding: 12px 15px;
            border: 1px solid #edf2f7;
            border-radius: 8px;
            width: 350px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        .btn-search {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #f8fafb;
            color: #636e72;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f1f3f5;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #fcfdfe;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #e6f9f4;
            color: #00b689;
        }

        .action-link {
            text-decoration: none;
            color: #b3b3b3;
            transition: 0.3s;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            line-height: 0;
        }

        .action-link:hover {
            color: var(--primary);
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div class="module-header">
        <h1 style="margin:0; font-size: 1.6rem; color: var(--text-dark);">Listado General de Estudiantes</h1>
        <p style="margin:5px 0 0; color: #636e72;">Registro completo de alumnos - Educación Primaria</p>
    </div>

    <div class="card-container">
        <div class="search-bar">
            <input type="text" placeholder="Buscar por cédula o apellidos...">
            <button class="btn-search"><i class="fas fa-search"></i> Buscar Estudiante</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Nombres y Apellidos Completos</th>
                    <th>Grado</th>
                    <th>Sección</th>
                    <th>Estatus y Acceso a Ficha</th>
                </tr>
            </thead>
            <tbody id="listaEstudiantes">
                    <!-- Estudiantes cargados desde la API dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        async function cargarEstudiantes(busqueda = '') {
            try {
                const token = localStorage.getItem('token');
                let url = '/api/estudiantes';
                if (busqueda) {
                    url += `?search=${encodeURIComponent(busqueda)}`;
                }

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const tbody = document.getElementById('listaEstudiantes');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No se encontraron estudiantes.</td></tr>';
                    return;
                }

                data.forEach(est => {
                    // Split nombre completo to make first part bold like the mockup
                    let nombreParts = est.nombre_completo.split(' ');
                    let nombreHTML = est.nombre_completo;
                    if (nombreParts.length > 1) {
                        nombreHTML = `<strong>${nombreParts[0]} ${nombreParts[1] || ''}</strong> ${nombreParts.slice(2).join(' ')}`;
                    } else {
                        nombreHTML = `<strong>${est.nombre_completo}</strong>`;
                    }

                    tbody.innerHTML += `
                    <tr>
                        <td>${est.cedula}</td>
                        <td>${nombreHTML}</td>
                        <td>${est.grado}</td>
                        <td><strong>A</strong></td> <!-- Sección asignada -->
                        <td>
                            <div class="status-container">
                                <span class="status">Inscrito</span>
                                <a href="/estudiantes/consulta?cedula=${est.cedula}" class="action-link" title="Ver Consulta Individual">
                                    <i class="fas fa-user-circle"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
                });

            } catch (error) {
                console.error(error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarEstudiantes();

            const btnSearch = document.querySelector('.btn-search');
            const inputSearch = document.querySelector('.search-bar input');

            btnSearch.addEventListener('click', () => {
                cargarEstudiantes(inputSearch.value.trim());
            });

            inputSearch.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    cargarEstudiantes(inputSearch.value.trim());
                }
            });
        });

        // Registrar el Service Worker para la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Error al registrar el ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>

</html>
