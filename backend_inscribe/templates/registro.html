<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - INSCRIBE SYSTEM</title>

    <link rel="icon" href="logo.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00b689">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        :root {
            --primary-color: #00b689;
            /* Tu nuevo color esmeralda */
            --primary-hover: #009671;
            --error-color: #ff4d4d;
            --bg-color: #f0f4f2;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* NOTIFICACIÓN DE ERROR SUPERIOR */
        .notification {
            position: fixed;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--error-color);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            max-width: 350px;
            z-index: 2000;
        }

        .notification.show {
            top: 20px;
        }

        .registration-card {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-img {
            width: 90px;
            height: auto;
            margin-bottom: 0.5rem;
        }

        .system-name {
            color: var(--primary-color);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 5px;
            display: block;
        }

        /* Contenedor para los campos con ojo */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #aaa;
            transition: 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .section-divider {
            grid-column: span 2;
            color: var(--primary-color);
            border-bottom: 2px solid #f9f9f9;
            margin: 15px 0 5px;
            padding-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .btn-submit {
            grid-column: span 2;
            background: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 182, 137, 0.2);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* MODAL DE ÉXITO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 380px;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="notif" class="notification">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notif-text">Error</span>
    </div>

    <div class="registration-card">
        <img src="logo.png" alt="Logo" class="logo-img">
        <div class="system-name">CREAR CUENTA</div>

        <form id="regForm" class="form-grid">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre">
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" id="apellido">
            </div>
            <div class="form-group full-width">
                <label>Usuario</label>
                <input type="text" id="usuario">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="pass1">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass1', this)"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="pass2">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass2', this)"></i>
                </div>
            </div>

            <div class="section-divider">Preguntas de Seguridad</div>

            <div class="form-group">
                <label>1. Color favorito</label>
                <input type="text" class="p_seg">
            </div>
            <div class="form-group">
                <label>2. Nombre de mascota</label>
                <input type="text" class="p_seg">
            </div>
            <div class="form-group">
                <label>3. Comida favorita</label>
                <input type="text" class="p_seg">
            </div>
            <div class="form-group">
                <label>4. Nombre materno</label>
                <input type="text" class="p_seg">
            </div>

            <button type="submit" class="btn-submit">FINALIZAR REGISTRO</button>
            <a href="/login"
                style="grid-column: span 2; margin-top: 15px; color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fas fa-arrow-left"></i> Volver al Login
            </a>
            <a href="/"
                style="grid-column: span 2; margin-top: 5px; color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fas fa-home"></i> Ver sitio público
            </a>
        </form>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle"></i>
            <h2>¡Registro Exitoso!</h2>
            <p>Tus datos han sido guardados correctamente. Ya puedes acceder al sistema.</p>
            <button class="btn-submit" onclick="window.location.href='/'">IR AL LOGIN</button>
        </div>
    </div>

    <script>
        // Función para mostrar/ocultar contraseña
        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                el.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Notificacion de error
        function mostrarError(mensaje) {
            const notif = document.getElementById('notif');
            document.getElementById('notif-text').innerText = mensaje;
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 3000);
        }

        document.getElementById('regForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;
            const preguntas = document.querySelectorAll('.p_seg');

            // Validar campos vacios
            if (!nombre || !apellido || !usuario || !pass1 || !pass2) {
                mostrarError("Por favor, rellene todos los campos básicos.");
                return;
            }

            // Validar preguntas de seguridad
            for (let p of preguntas) {
                if (p.value.trim() === "") {
                    mostrarError("Responda todas las preguntas de seguridad.");
                    return;
                }
            }

            // Validación de contraseñas
            if (pass1 !== pass2) {
                mostrarError("¡Error! Las contraseñas no coinciden.");
                return;
            }

            // Enviar peticion de registro al backend
            try {
                const response = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nombre,
                        apellido: apellido,
                        usuario: usuario,
                        password: pass1
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Muestra modal de exito
                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    mostrarError(data.message || "Error al registrar el usuario.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                mostrarError("No se pudo conectar con el servidor.");
            }
        });

        // Registrar el Service Worker para la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Error al registrar el ServiceWorker:', error);
                    });
            });
        }

    </script>
</body>

</html>
