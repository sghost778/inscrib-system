<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - INSCRIBE SYSTEM</title>

    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #00b689;
            --primary-hover: #009671;
            --error-color: #ff4d4d;
            --bg-color: #f0f4f2;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* NOTIFICACIA"N DE ERROR SUPERIOR */
        .notification {
            position: fixed;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--error-color);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        .notification.show {
            top: 20px;
        }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-img {
            width: 90px;
            height: auto;
            margin-bottom: 0.5rem;
        }

        .system-name {
            color: var(--primary-color);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #aaa;
            transition: 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .links {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="notif" class="notification">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notif-text">Error</span>
    </div>

    <div class="login-card">
        <img src="{{ url_for('static', filename='logo.png') }}" onerror="this.src='logo.png'" alt="Logo"
            class="logo-img">
        <div class="system-name">INICIAR SESIA"N</div>

        <p style="font-size: 0.85rem; color:#666; margin-bottom: 15px;">
            <i class="fas fa-info-circle text-info"></i> Ingresa tu usuario y contrasena para acceder al sistema.
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" value="admin">
            </div>

            <div class="form-group">
                <label>Contrasena</label>
                <div class="password-wrapper">
                    <input type="password" id="password" value="admin123">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePass('password', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">ENTRAR AL SISTEMA</button>

            <div class="links">
                <a href="/registro">Crear Cuenta</a>
                <a href="/recuperar">Olvide mi clave</a>
                <a href="/" style="color:#888;"><i class="fas fa-home"></i> Sitio Publico</a>
            </div>
        </form>
    </div>

    <script>
        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                el.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function mostrarError(mensaje) {
            const notif = document.getElementById('notif');
            document.getElementById('notif-text').innerText = mensaje;
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Guardar token y usuario
                    if (data.token) localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', data.usuario);
                    localStorage.setItem('rol', data.rol || 'admin');
                    window.location.href = '/menu';
                } else {
                    mostrarError(data.message || "Usuario o clave incorrectos");
                }
            } catch (error) {
                console.error("Error:", error);
                mostrarError("Error de conexion con el servidor");
            }
        });
    </script>
</body>

</html>
