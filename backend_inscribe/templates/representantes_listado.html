<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Listado de Representantes - INSCRIBE SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00b689">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        :root {
            --primary-color: #00b689;
            --text-main: #2d3436;
            --bg-table: #ffffff;
            --bg-body: #f8fafb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            padding: 30px;
            margin: 0;
            color: var(--text-main);
        }

        /* ENCABEZADO LIMPIO */
        .header-simple {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .header-simple i {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-right: 15px;
        }

        .header-simple h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* BUSCADOR */
        .search-box {
            position: relative;
            margin-bottom: 20px;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #dfe4ea;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 182, 137, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        /* TABLA DE REPRESENTANTES */
        .table-card {
            background: var(--bg-table);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f1f2f6;
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #636e72;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f2f6;
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f9fdfc;
        }

        /* BADGES Y BOTONES */
        .hijos-tag {
            background: #edf2f7;
            color: #2d3436;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-active {
            color: var(--primary-color);
            background: rgba(0, 182, 137, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .btn-ficha {
            color: var(--primary-color);
            font-size: 1.4rem;
            text-decoration: none;
            transition: transform 0.2s, color 0.2s;
            display: inline-block;
        }

        .btn-ficha:hover {
            transform: scale(1.2);
            color: #008a68;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="header-simple">
        <i class="fas fa-address-book"></i>
        <h2>Listado General de Representantes</h2>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="inputBusqueda" placeholder="Buscar representante por nombre o cédula...">
    </div>

    <div class="table-card">
        <table id="tablaRepresentantes">
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Nombres y Apellidos Completos</th>
                    <th class="text-center">Hijos</th>
                    <th>Estatus</th>
                    <th class="text-center">Acceso Ficha</th>
                </tr>
            </thead>
            <tbody id="listaRepresentantes">
                <!-- Se cargara dinamicamente desde la API -->
            </tbody>
        </table>
    </div>

    <script>
        async function cargarRepresentantes(busqueda = '') {
            try {
                const token = localStorage.getItem('token');
                let url = '/api/representantes';
                if (busqueda) {
                    url += `?search=${encodeURIComponent(busqueda)}`;
                }
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const tbody = document.getElementById('listaRepresentantes');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No se encontraron representantes.</td></tr>';
                    return;
                }

                data.forEach(rep => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${rep.cedula}</td>
                            <td>${rep.nombre_completo}</td>
                            <td class="text-center"><span class="hijos-tag">${rep.hijos_registrados}</span></td>
                            <td><span class="status-active">ACTIVO</span></td>
                            <td class="text-center">
                                <a href="/representantes/consulta?cedula=${rep.cedula}" class="btn-ficha" title="Consultar Ficha">
                                    <i class="fas fa-user-check"></i>
                                </a>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error cargando representantes:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => cargarRepresentantes());

        // Filtrado por API al escribir (con debounce)
        let timeoutBusqueda;
        document.getElementById('inputBusqueda').addEventListener('keyup', function () {
            clearTimeout(timeoutBusqueda);
            const busqueda = this.value.trim();
            timeoutBusqueda = setTimeout(() => {
                cargarRepresentantes(busqueda);
            }, 300);
        });
    </script>
</body>

</html>
