<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - INSCRIBE SYSTEM</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00b689;
            --primary-hover: #009671;
            --error-color: #ff4d4d;
            --bg-color: #f0f4f2;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5f0, #f0f4f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-img {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }

        .brand-name {
            color: #777;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h2 {
            color: var(--primary-color);
            text-transform: uppercase;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--error-color);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            z-index: 999;
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 360px;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        @keyframes pop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        a.back {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div id="notif" class="notification">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notif-text">Error</span>
    </div>

    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
        <div class="brand-name">INSCRIBE SYSTEM</div>
        <h2>Restablecer Contraseña</h2>

        <div class="form-group">
            <label>Nueva Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="pass1" placeholder="Minimo 4 caracteres">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass1', this)"></i>
            </div>
        </div>

        <div class="form-group">
            <label>Confirmar Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="pass2" placeholder="Repite la contrasena">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass2', this)"></i>
            </div>
        </div>

        <button class="btn" onclick="restablecer()">RESTABLECER</button>

        <a class="back" href="/login"><i class="fas fa-arrow-left"></i> Volver al inicio de sesion</a>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle"></i>
            <h2 style="margin-bottom: 10px;">¡Listo!</h2>
            <p style="color: #666; margin-bottom: 20px;">Tu contraseña ha sido actualizada correctamente.</p>
            <button class="btn" id="btnFinal">IR AL LOGIN</button>
        </div>
    </div>

    <script>
        const notif = document.getElementById('notif');
        const notifText = document.getElementById('notif-text');

        function mostrarError(mensaje) {
            notifText.innerText = mensaje;
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 3500);
        }

        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                el.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const params = new URLSearchParams(window.location.search);
        const token = (params.get('token') || '').trim();

        async function restablecer() {
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            if (!token) {
                mostrarError('El enlace no contiene un token valido. Solicita uno nuevo.');
                return;
            }
            if (p1 === "" || p2 === "") {
                mostrarError("Complete ambos campos");
                return;
            }
            if (p1 !== p2) {
                mostrarError("Las contrasenas no coinciden");
                return;
            }
            if (p1.length < 4) {
                mostrarError("La contrasena debe tener al menos 4 caracteres");
                return;
            }
            try {
                const res = await fetch('/api/restablecer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: p1 })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('successModal').style.display = 'flex';
                    const btnFinal = document.getElementById('btnFinal');
                    const destino = data.redirect || '/login';
                    btnFinal.textContent = (destino === '/portal' ? 'IR AL PORTAL' : 'IR AL LOGIN');
                    btnFinal.onclick = () => { window.location.href = destino; };
                    setTimeout(() => { window.location.href = destino; }, 2500);
                } else {
                    mostrarError(data.message || 'No se pudo restablecer la contrasena');
                }
            } catch (e) {
                mostrarError('Error de conexion. Intenta de nuevo.');
            }
        }
    </script>

</body>

</html>
