<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar - INSCRIBE SYSTEM</title>

    <link rel="icon" href="logo.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00b689">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        :root {
            --primary-color: #00b689;
            --primary-hover: #009671;
            --error-color: #ff4d4d;
            --bg-color: #f0f4f2;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Notificacion de Error */
        .notification {
            position: fixed;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--error-color);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            max-width: 350px;
            z-index: 2000;
        }

        .notification.show {
            top: 20px;
        }

        .container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilo del Logo Central */
        .logo-img {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }

        .brand-name {
            color: #777;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        h2 {
            color: var(--primary-color);
            text-transform: uppercase;
            font-size: 1.3rem;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .step {
            display: none;
            text-align: left;
        }

        .step.active {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
        }

        /* Wrapper para el ojito */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            margin-top: 5px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            cursor: pointer;
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 182, 137, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 360px;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="notif" class="notification">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notif-text">Error</span>
    </div>

    <div class="container">
        <img src="logo.png" alt="Logo" class="logo-img">
        <div class="brand-name">INSCRIBE SYSTEM</div>

        <div id="step1" class="step active">
            <h2>Recuperar Cuenta</h2>
            <label>Usuario</label>
            <input type="text" id="user_rec" placeholder="Ingrese su usuario">
            <button class="btn" onclick="validarPaso1()">CONTINUAR</button>
        </div>

        <div id="step2" class="step">
            <h2>Verificacion</h2>
            <label>1. Color favorito</label>
            <input type="text" id="q1">
            <label>2. Nombre de mascota</label>
            <input type="text" id="q2">
            <label>3. Comida favorita</label>
            <input type="text" id="q3">
            <label>4. Nombre materno</label>
            <input type="text" id="q4">
            <button class="btn" onclick="validarPaso2()">VERIFICAR</button>
        </div>

        <div id="step3" class="step">
            <h2>Nueva Contraseña</h2>
            <label>Nueva Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="pass1" placeholder="Ingrese su nueva contraseña">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass1', this)"></i>
            </div>
            <label>Confirmar Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="pass2" placeholder="Ingrese su nueva contraseña">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePass('pass2', this)"></i>
            </div>
            <button class="btn" onclick="validarFinal()">RESTABLECER</button>
        </div>

        <a href="/login"
            style="display:block; margin-top:20px; color:#888; text-decoration:none; font-size:0.85rem; font-weight: 600;">
            <i class="fas fa-arrow-left"></i> Volver al login
        </a>
        <a href="/"
            style="display:block; margin-top:8px; color:#888; text-decoration:none; font-size:0.85rem; font-weight: 600;">
            <i class="fas fa-home"></i> Ver sitio público
        </a>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle"></i>
            <h2 style="margin-bottom: 10px;">¡Listo!</h2>
            <p style="color: #666; margin-bottom: 20px;">Tu contraseña ha sido actualizada correctamente.</p>
            <button class="btn" onclick="window.location.href='/login'">REGRESAR AL LOGIN</button>
        </div>
    </div>

    <script>
        const notif = document.getElementById('notif');
        const notifText = document.getElementById('notif-text');

        function mostrarError(mensaje) {
            notifText.innerText = mensaje;
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 3000);
        }

        // Funcion para ver contrasena
        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                el.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function nextStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        function validarPaso1() {
            if (document.getElementById('user_rec').value.trim() === "") {
                mostrarError("Debe ingresar su usuario");
            } else { nextStep(2); }
        }

        function validarPaso2() {
            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const q3 = document.getElementById('q3').value;
            const q4 = document.getElementById('q4').value;
            if (q1 === "" || q2 === "" || q3 === "" || q4 === "") {
                mostrarError("Responda todas las preguntas");
            } else { nextStep(3); }
        }

        function validarFinal() {
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            if (p1 === "" || p2 === "") {
                mostrarError("Complete los campos");
            } else if (p1 !== p2) {
                mostrarError("Las contrasenas no coinciden");
            } else {
                document.getElementById('successModal').style.display = 'flex';
            }
        }

        // Registrar el Service Worker para la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con exito:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Error al registrar el ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>

</html>
