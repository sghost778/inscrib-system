<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - INSCRIBE SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #00b689, #00d2ad);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #2d3436;
        }
        .card {
            background: #fff; border-radius: 18px; padding: 35px 30px;
            width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .card h1 { margin: 0 0 6px; font-size: 1.5rem; color: #00b689; text-align: center; }
        .card p.sub { margin: 0 0 22px; text-align: center; color: #636e72; font-size: 0.92rem; }
        label { display: block; font-size: 0.82rem; font-weight: 700; color: #636e72; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; border: 1px solid #dfe4ea;
            border-radius: 10px; font-size: 0.95rem; margin-bottom: 16px;
        }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: #00b689; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #009e78; }
        .msg { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 0.9rem; display: none; }
        .msg.ok { background: #e6f9f1; color: #0a7d56; border: 1px solid #b7ecd8; display: block; }
        .msg.err { background: #fdecec; color: #b42318; border: 1px solid #f5c2c2; display: block; }
        .links { margin-top: 18px; text-align: center; font-size: 0.9rem; }
        .links a { color: #00b689; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-key"></i> Recuperar Contraseña</h1>
        <p class="sub">Ingresa tu cédula para verificar tu cuenta.</p>
        <form id="formRecuperar">
            <label for="cedula">Cédula</label>
            <input type="text" id="cedula" placeholder="Ej. V-12345678" required>
            <button type="submit">Verificar</button>
        </form>
        <div id="msg" class="msg"></div>
        <div class="links">
            <a href="/login"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        document.getElementById('formRecuperar').addEventListener('submit', async function (e) {
            e.preventDefault();
            const cedula = document.getElementById('cedula').value.trim();
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            if (!cedula) { msg.className = 'msg err'; msg.textContent = 'Ingresa tu cédula.'; return; }
            try {
                const res = await fetch('/api/portal/recuperar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cedula: cedula })
                });
                const data = await res.json();
                if (data.success) {
                    msg.className = 'msg ok';
                    msg.textContent = data.message;
                } else {
                    msg.className = 'msg err';
                    msg.textContent = data.message || 'No se pudo verificar la cuenta.';
                }
            } catch (err) {
                msg.className = 'msg err';
                msg.textContent = 'Error de conexión. Intenta más tarde.';
            }
        });
    </script>
</body>
</html>
