<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería - U.E. Dr. José Manuel Cova Maza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Inter', sans-serif; color: #2d3436; }

        :root { --primary: #00b689; --primary-dark: #009671; }



        nav {

            background: white; padding: 0 40px; display: flex; align-items: center;

            justify-content: space-between; height: 75px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.04);

            position: fixed; top: 0; left: 0; right: 0; z-index: 100;

        }

        nav .logo { display: flex; align-items: center; gap: 10px; }

        nav .logo img { height: 45px; }

        nav .logo span { font-weight: 800; color: var(--primary); font-size: 1rem; }

        nav .menu a {

            text-decoration: none; color: #555; font-weight: 600; font-size: 0.9rem;

            margin-left: 25px; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);

        }

        nav .menu a:hover, nav .menu a.active { color: var(--primary); }

        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; color: #555; }



        .page-header {

            margin-top: 75px; background: linear-gradient(135deg, var(--primary), #00d2ad);

            padding: 60px 40px; text-align: center; color: white;

        }

        .page-header h1 { font-size: 2.2rem; }



        section { padding: 60px 40px; max-width: 1200px; margin: 0 auto; }



        .galeria-grid {

            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px;

        }

        .galeria-item {

            position: relative; border-radius: 12px; overflow: hidden; cursor: pointer;

            box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); height: 220px;

        }

        .galeria-item:hover { transform: scale(1.02); }

        .galeria-item img { width: 100%; height: 100%; object-fit: cover; }

        .galeria-item .overlay {

            position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7));

            padding: 15px; color: white;

        }

        .galeria-item .overlay h4 { font-size: 0.95rem; }



        .modal-img {

            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;

            background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;

            padding: 40px;

        }

        .modal-img.open { display: flex; }

        .modal-img img { max-width: 90%; max-height: 85vh; border-radius: 12px; }

        .modal-img .close {

            position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem;

            cursor: pointer; opacity: 0.7;

        }

        .modal-img .close:hover { opacity: 1; }



        footer {

            background: #2d3436; color: white; text-align: center; padding: 30px;

        }

        footer p { opacity: 0.7; font-size: 0.9rem; }

        footer a { color: var(--primary); text-decoration: none; }



        @media (max-width: 768px) {

            nav { padding: 0 20px; }

            nav .menu { display: none; flex-direction: column; position: absolute; top: 75px;

                left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.04); }

            nav .menu.open { display: flex; }

            nav .menu a { margin: 10px 0; }

            .menu-toggle { display: block; }

            section { padding: 40px 20px; }

        }

    </style>

</head>

<body>



<nav>

    <div class="logo">

        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">

        <span id="navTitle">U.E. Dr. José Manuel Cova Maza</span>

    </div>

    <div class="menu" id="navMenu">

        <a href="/">Inicio</a>

        <a href="/nosotros">Nosotros</a>

        <a href="/programas">Programas</a>

        <a href="/noticias">Noticias</a>

        <a href="/requisitos">Requisitos</a>

        <a href="/galeria" class="active">Galería</a>

        <a href="/contacto">Contacto</a>

        <a href="/portal" style="color:var(--primary)"><i class="fas fa-user-friends"></i> Representantes</a>

        

    </div>

    <div class="menu-toggle" onclick="document.getElementById('navMenu').classList.toggle('open')">

        <i class="fas fa-bars"></i>

    </div>

</nav>



<div class="page-header">

    <h1>Galería de Imágenes</h1>

</div>



<section>

    <div class="galeria-grid" id="galeriaContainer"></div>

</section>



<div class="modal-img" id="modalImg" onclick="this.classList.remove('open')">

    <span class="close">&times;</span>

    <img id="modalImgSrc" src="" alt="">

</div>



<footer>

    <p id="footerText">&copy; 2026 Unidad Educativa Dr. José Manuel Cova Maza. Todos los derechos reservados.</p>

    <p style="margin-top:8px;"><a href="/portal" style="margin-right:15px;"><i class="fas fa-user-friends"></i> Portal Representantes</a>

        <a href="/login"><i class="fas fa-user-shield"></i> Acceso Administrativo</a></p>

</footer>



<script>

    async function cargarConfig() {

        try {

            const res = await fetch('/api/site-config');

            const cfg = await res.json();

            if (cfg.site_name) {

                document.getElementById('navTitle').textContent = cfg.site_name;

                document.getElementById('footerText').innerHTML = '&copy; 2026 ' + cfg.site_name + '. Todos los derechos reservados.';

            }

        } catch(e) { console.error(e); }

    }

    cargarConfig();



    async function cargarGaleria() {

        try {

            const res = await fetch('/api/galeria');

            const imagenes = await res.json();

            const container = document.getElementById('galeriaContainer');

            if (!imagenes.length) {

                container.innerHTML = '<p style="text-align:center;color:#636e72;">No hay imágenes en la galería.</p>';

                return;

            }

            container.innerHTML = imagenes.map(g => `

                <div class="galeria-item" onclick="verImagen('${g.imagen}')">

                    <img src="${g.imagen}" alt="${g.titulo || ''}" onerror="this.src='https://via.placeholder.com/400x300?text=Galería'">

                    <div class="overlay"><h4>${g.titulo || ''}</h4></div>

                </div>

            `).join('');

        } catch(e) { console.error(e); }

    }



    function verImagen(src) {

        document.getElementById('modalImgSrc').src = src;

        document.getElementById('modalImg').classList.add('open');

    }



    cargarGaleria();

</script>

</body>

</html>
